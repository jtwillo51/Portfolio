<!doctype html>
<!--
  Source for public/og.png, the 1200×630 link-preview card. Render it with
  headless Chrome from the project root; the command is in the README.
  The fonts are the site's own, loaded from public/fonts.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Anybody'; src: url('../public/fonts/anybody.woff2') format('woff2-variations'); font-weight: 100 900; font-stretch: 50% 150%; }
@font-face { font-family: 'Archivo'; src: url('../public/fonts/archivo.woff2') format('woff2-variations'); font-weight: 400 700; font-stretch: 62% 125%; }
@font-face { font-family: 'Martian Mono'; src: url('../public/fonts/martian.woff2') format('woff2-variations'); font-weight: 300 700; font-stretch: 75% 112%; }

html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #e8e7e1; color: #14171a; font-family: 'Archivo', Arial, sans-serif; }

/* The printed sheet from the site, laid on its paper ground. */
.sheet {
  position: absolute; inset: 34px;
  background: #f7f6f2; border: 1px solid #cfcec6; box-shadow: inset 0 1px 0 #fffefa;
  padding: 50px 60px 44px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.label {
  margin: 0; display: flex; align-items: center; gap: 16px;
  font-family: 'Martian Mono', monospace; font-size: 17px; font-stretch: 88%;
  letter-spacing: 0.14em; text-transform: uppercase; color: #4a5057;
}
.dot { width: 11px; height: 11px; border-radius: 50%; background: #a34009; }
h1 {
  margin: 0;
  font-family: 'Anybody', 'Archivo Narrow', Arial, sans-serif;
  font-weight: 780; font-stretch: 78%;
  font-size: 108px; line-height: 0.93; letter-spacing: -0.005em;
}
h1 em { font-style: normal; color: #a34009; }
.foot {
  display: flex; justify-content: space-between; align-items: flex-end;
  border-top: 1px solid #cfcec6; padding-top: 20px;
}
.name {
  font-family: 'Anybody', Arial, sans-serif; font-weight: 740; font-stretch: 86%;
  font-size: 40px; line-height: 1;
}
.roles {
  font-family: 'Martian Mono', monospace; font-size: 15px; font-stretch: 88%;
  letter-spacing: 0.1em; text-transform: uppercase; color: #4a5057;
  text-align: right; line-height: 1.7;
}
</style>
</head>
<body>
  <div class="sheet">
    <p class="label"><span class="dot"></span>Gilbert, Arizona · Software engineer</p>
    <h1>I build software<br>for people who are<br><em>standing up.</em></h1>
    <div class="foot">
      <div class="name">Jeremy Willoughby</div>
      <div class="roles">Forward deployed · Senior front-end<br>Vue 3 · Agentic pipelines · Shipped iOS</div>
    </div>
  </div>
</body>
</html>
